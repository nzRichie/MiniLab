# MiniLabs lab menu, generated by labs/release/make-release.sh, or by its
# one-lab sibling publish-lab.sh. Do not edit by hand: the next release build
# overwrites this file. Edit labs/tui/config.toml in the source repository
# instead.
#
# Script paths are relative to this file's directory. Launch through ./minilabs,
# which changes to that directory before starting the engine; running the binary
# from anywhere else will not find these scripts.


